<style>
  :root{
    --ground:#F2F0F9; --surface:#FFFFFF; --ink:#1D1A33; --muted:#6B6787; --line:#DDD9EC;
    --accent:#F0482B; --accent-ink:#FFFFFF; --accent-soft:rgba(240,72,43,.12);
    --gold:#E9A81C; --stamp:#E0432B; --stamp-blend:multiply;
    --shadow:0 18px 40px -18px rgba(29,26,51,.28), 0 1px 0 rgba(29,26,51,.04);
    --c0:#177A4F; --c1:#3B5BDB; --c2:#C93A78; --c3:#8144C5; --c4:#C46A0F; --c5:#0F8B9C; --c6:#5E5E7E;
    --focus:rgba(240,72,43,.55);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#14122A; --surface:#1F1C3B; --ink:#F1EFFA; --muted:#A39FC2; --line:#35325C;
      --accent:#FF6A4D; --accent-ink:#1A1026; --accent-soft:rgba(255,106,77,.16);
      --gold:#FFC54D; --stamp:#FF5B40; --stamp-blend:normal;
      --shadow:0 18px 40px -18px rgba(0,0,0,.6);
      --c0:#3DD598; --c1:#8DA2FF; --c2:#FF7AB0; --c3:#C084FC; --c4:#FFA94D; --c5:#3CC7DA; --c6:#A9A9C8;
      --focus:rgba(255,106,77,.6);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ground:#14122A; --surface:#1F1C3B; --ink:#F1EFFA; --muted:#A39FC2; --line:#35325C;
    --accent:#FF6A4D; --accent-ink:#1A1026; --accent-soft:rgba(255,106,77,.16);
    --gold:#FFC54D; --stamp:#FF5B40; --stamp-blend:normal;
    --shadow:0 18px 40px -18px rgba(0,0,0,.6);
    --c0:#3DD598; --c1:#8DA2FF; --c2:#FF7AB0; --c3:#C084FC; --c4:#FFA94D; --c5:#3CC7DA; --c6:#A9A9C8;
    --focus:rgba(255,106,77,.6);
    color-scheme:dark;
  }

  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--ground); color:var(--ink);
    font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .app{max-width:440px; margin:0 auto; padding:22px 18px 44px; display:flex; flex-direction:column; gap:26px}

  /* ---- header ---- */
  .top{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
  .brand{font-family:"Bricolage Grotesque","Figtree",sans-serif; font-weight:800; font-size:19px; letter-spacing:-.01em; margin:0}
  .brand span{color:var(--accent)}
  .date{margin:0; color:var(--muted); font-size:14px; font-weight:500; font-variant-numeric:tabular-nums; text-align:right}

  /* ---- challenge card (the one lifted object) ---- */
  .card{position:relative; background:var(--surface); border-radius:24px; padding:24px 22px 22px; box-shadow:var(--shadow)}
  .eyebrow{display:flex; justify-content:space-between; align-items:center; min-height:30px}
  .chip{display:inline-flex; align-items:center; gap:7px; padding:5px 11px 5px 9px; border-radius:999px;
        background:color-mix(in srgb,var(--cat) 14%,transparent); color:var(--cat); font-weight:600; font-size:13px; line-height:1.2}
  .chip i{width:8px; height:8px; border-radius:50%; background:var(--cat)}
  .swapped-tag{font-size:12px; color:var(--muted); font-weight:500}
  .challenge{
    font-family:"Bricolage Grotesque","Figtree",sans-serif; font-weight:700; font-size:clamp(26px,7.2vw,31px);
    line-height:1.16; letter-spacing:-.015em; margin:18px 0 14px; text-wrap:balance;
  }
  .why{margin:0 0 22px; color:var(--muted); font-size:15px; line-height:1.5}
  .why b{display:block; font-family:"Figtree",sans-serif; font-weight:700; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:2px}

  .btn{appearance:none; border:0; cursor:pointer; font-family:inherit; border-radius:16px; transition:transform .12s ease, opacity .15s ease}
  .btn:active{transform:scale(.98)}
  .btn:focus-visible{outline:3px solid var(--focus); outline-offset:3px}
  .btn-done{
    width:100%; min-height:58px; background:var(--accent); color:var(--accent-ink);
    font-family:"Bricolage Grotesque","Figtree",sans-serif; font-weight:800; font-size:21px; letter-spacing:.01em;
  }
  .btn-done:hover{filter:brightness(1.05)}
  .after{display:none; align-items:flex-start; justify-content:space-between; gap:14px; padding-top:4px}
  .after p{margin:0; font-size:15px; line-height:1.45}
  .after p strong{font-family:"Bricolage Grotesque","Figtree",sans-serif; font-weight:700}
  .btn-undo{background:none; color:var(--muted); font-size:13px; font-weight:600; padding:6px 0; text-decoration:underline; text-underline-offset:3px; flex:none; border-radius:6px}
  .card.is-done .btn-done{display:none}
  .card.is-done .after{display:flex}

  .stamp{
    position:absolute; top:14px; right:14px; padding:5px 12px 4px; border:3px solid var(--stamp); border-radius:8px;
    color:var(--stamp); font-family:"Bricolage Grotesque","Figtree",sans-serif; font-weight:800; font-size:24px; line-height:1.15;
    letter-spacing:.14em; text-transform:uppercase; transform:rotate(-12deg); opacity:0; pointer-events:none;
    mix-blend-mode:var(--stamp-blend);
    box-shadow:inset 0 0 0 2px var(--surface), inset 0 0 0 3.5px var(--stamp);
  }
  .card.is-done .stamp{opacity:.92}
  .card.is-done.just .stamp{animation:stamp-in .45s cubic-bezier(.2,1.5,.45,1) both}
  .card.is-done.just{animation:thump .4s ease-out}
  @keyframes stamp-in{
    0%{transform:rotate(-20deg) scale(2.4); opacity:0}
    55%{transform:rotate(-12deg) scale(.94); opacity:.95}
    100%{transform:rotate(-12deg) scale(1); opacity:.92}
  }
  @keyframes thump{0%{transform:scale(1)} 45%{transform:scale(.985)} 100%{transform:scale(1)}}

  /* ---- stats strip ---- */
  .stats{display:grid; grid-template-columns:repeat(3,1fr); padding:2px 0}
  .stat{display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px 6px}
  .stat + .stat{border-left:1px solid var(--line)}
  .stat .v{display:inline-flex; align-items:center; gap:5px; font-family:"Bricolage Grotesque","Figtree",sans-serif; font-weight:800; font-size:30px; line-height:1.1; font-variant-numeric:tabular-nums}
  .stat .v svg{color:var(--gold); width:20px; height:20px; display:none}
  .stat .v.hot svg{display:block}
  .stat .l{font-size:11.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}

  /* ---- sections ---- */
  section{display:flex; flex-direction:column; gap:12px}
  .sec-h{display:flex; justify-content:space-between; align-items:baseline}
  h2{font-family:"Bricolage Grotesque","Figtree",sans-serif; font-weight:700; font-size:17px; margin:0; letter-spacing:-.01em}
  .sec-h small{color:var(--muted); font-size:13px; font-weight:500}

  .grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px 6px}
  .wd{text-align:center; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .day{
    aspect-ratio:1; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:600;
    font-variant-numeric:tabular-nums; color:var(--muted); background:var(--surface); border:1px solid var(--line);
  }
  .day.done{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700}
  .day.today{outline:2px solid var(--accent); outline-offset:2px; color:var(--ink)}
  .day.today.done{color:var(--accent-ink)}

  .actions{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .btn-sec{min-height:48px; background:var(--surface); color:var(--ink); border:1px solid var(--line); font-weight:600; font-size:15px; border-radius:14px}
  .btn-sec:hover{border-color:var(--muted)}
  .btn-sec[disabled]{opacity:.45; cursor:not-allowed}
  .hint{margin:0; font-size:13px; color:var(--muted)}
  .btn-fb{width:100%; min-height:48px; background:var(--surface); color:var(--ink); border:1px solid var(--line); font-weight:600; font-size:15px; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:8px; text-decoration:none}
  .btn-fb:hover{border-color:var(--muted)}
  .btn-fb svg{width:18px; height:18px; color:var(--accent)}
  .btn-install{width:100%; min-height:48px; background:var(--accent-soft); color:var(--accent); border:1px solid transparent; font-weight:700; font-size:15px; border-radius:14px}
  .btn-install[hidden]{display:none}

  .hist{list-style:none; margin:0; padding:0}
  .hist li{display:grid; grid-template-columns:64px 1fr; gap:10px; padding:10px 0; border-top:1px solid var(--line); font-size:15px; line-height:1.4}
  .hist li:first-child{border-top:0; padding-top:0}
  .hist .d{color:var(--muted); font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; padding-top:2px}
  .empty{margin:0; color:var(--muted); font-size:14px}

  .how{border-top:1px solid var(--line); padding-top:18px; color:var(--muted); font-size:14px; line-height:1.55}
  .how p{margin:0 0 8px}
  .how p:last-child{margin:0}
  .how strong{color:var(--ink); font-weight:600}
  .how a{color:var(--muted)}
  .foot-links{display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-top:10px; font-size:13px}
  .lang{appearance:none; margin-left:auto; background:none; border:1px solid var(--line); color:var(--muted); font-family:inherit; font-size:13px; font-weight:600; padding:4px 11px; border-radius:999px; cursor:pointer}
  .lang:hover{border-color:var(--muted); color:var(--ink)}
  .lang:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
  @media (display-mode: standalone){ .p-install{display:none} }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(8px); background:var(--ink); color:var(--ground);
    padding:10px 16px; border-radius:999px; font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
  }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1 class="brand" id="brand">Sfida</h1>
    <p class="date" id="date">—</p>
  </header>

  <article class="card" id="card">
    <div class="stamp" id="stamp" aria-hidden="true">Done</div>
    <div class="eyebrow">
      <span class="chip" id="chip"><i></i><span id="chipName">—</span></span>
      <span class="swapped-tag" id="swappedTag" hidden></span>
    </div>
    <p class="challenge" id="text">—</p>
    <p class="why" id="why"><b id="whyLabel">Why</b><span id="whyText">—</span></p>
    <button class="btn btn-done" id="btnDone" type="button">Done!</button>
    <div class="after" id="after">
      <p id="afterText"></p>
      <button class="btn btn-undo" id="btnUndo" type="button">Undo</button>
    </div>
  </article>

  <div class="stats" id="stats" aria-label="Your numbers">
    <div class="stat"><span class="v" id="vStreak"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c.6 4.2 5.2 6 5.2 11a5.2 5.2 0 0 1-10.4 0c0-2.1.9-3.7 2.2-5 .1 2 .9 3.2 2.1 3.4C11.2 8.6 10.6 5.4 12 2z" fill="currentColor"/></svg><span>0</span></span><span class="l" id="lStreak">Streak</span></div>
    <div class="stat"><span class="v" id="vBest">0</span><span class="l" id="lBest">Best</span></div>
    <div class="stat"><span class="v" id="vTotal">0</span><span class="l" id="lTotal">Completed</span></div>
  </div>

  <section>
    <div class="sec-h"><h2 id="gridTitle">Last four weeks</h2><small id="gridRange"></small></div>
    <div class="grid" id="grid" role="img" aria-label="Calendar of the last 28 days"></div>
  </section>

  <section>
    <div class="actions">
      <button class="btn btn-sec" id="btnSwap" type="button">Swap challenge</button>
      <button class="btn btn-sec" id="btnShare" type="button">Share</button>
    </div>
    <p class="hint" id="swapHint"></p>
    <a class="btn-fb" id="fbLink" href="https://docs.google.com/forms/d/e/1FAIpQLSfcSHVdqzC_vUE8eYLzay0kJs-D1uarMKkdbdt2P8CVXwHz2A/viewform" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H7l-3 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span id="fbText">Tell me what you think</span>
    </a>
    <button class="btn btn-install" id="btnInstall" type="button" hidden>Install on your phone</button>
  </section>

  <section>
    <div class="sec-h"><h2 id="histTitle">Completed challenges</h2><small id="histCount"></small></div>
    <ul class="hist" id="hist"></ul>
    <p class="empty" id="histEmpty"></p>
  </section>

  <footer class="how">
    <p id="howText"></p>
    <p id="installText" class="p-install"></p>
    <p class="foot-links"><a href="./privacy.html">Privacy</a><span id="versionText"></span><button class="lang" id="btnLang" type="button" aria-label="Change language"></button></p>
  </footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  // Lista unica, a rotazione tra le categorie: la sfida n è della categoria n % 7. Gli id non dipendono dalla lingua.
  var CH = [];
  for (var i = 0; i < 12; i++) for (var c = 0; c < 7; c++) CH.push({ id: c * 12 + i, c: c, i: i });
  var N = CH.length, STEP = 17; // 17 e 84 sono coprimi: 84 giorni senza ripetizioni, mai due giorni di fila la stessa categoria
  var byId = {}; CH.forEach(function (x) { byId[x.id] = x; });
  function chText(ch) { return RAW[LANG][ch.c][ch.i][0]; }
  function chWhy(ch) { return RAW[LANG][ch.c][ch.i][1]; }

  // ---------- date ----------
  function key(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function dayIndex(d) { return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); }
  function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
  function mainFor(d) { return CH[((dayIndex(d) * STEP) % N + N) % N]; }
  function altFor(d) { return CH[(((dayIndex(d) * STEP) % N + N) % N + 1) % N]; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function fmtLong(d) { return cap(d.toLocaleDateString(locale(), { weekday: 'long', day: 'numeric', month: 'long' })); }
  function fmtShort(d) { return d.toLocaleDateString(locale(), { day: 'numeric', month: 'short' }).replace('.', ''); }

  // ---------- stato / state ----------
  var KEY = 'sfida-del-giorno-v1';
  var S = { done: {}, swapped: {}, best: 0 };
  function load() { try { var r = localStorage.getItem(KEY); if (r) { var o = JSON.parse(r); S = { done: o.done || {}, swapped: o.swapped || {}, best: o.best || 0 }; } } catch (e) {} }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  function currentFor(d) { var k = key(d); if (S.done[k] && byId[S.done[k].id]) return byId[S.done[k].id]; return S.swapped[k] ? altFor(d) : mainFor(d); }
  function streak() {
    var d = new Date(); var k = key(d); var n = 0;
    if (!S.done[k]) { d = addDays(d, -1); k = key(d); }
    while (S.done[k]) { n++; d = addDays(d, -1); k = key(d); }
    return n;
  }
  function cheer(n) {
    if (LANG === 'it') {
      if (n >= 30) return 'Trenta giorni di fila. Ormai fa parte di te.';
      if (n >= 14) return 'Due settimane di fila: la costanza è il tuo superpotere.';
      if (n >= 7) return 'Una settimana intera, senza saltare un giorno.';
      if (n >= 3) return n + ' giorni di fila: sta diventando un’abitudine.';
      if (n === 2) return 'Due timbri di fila. Domani il terzo.';
      return 'Primo timbro! Domani il secondo.';
    }
    if (n >= 30) return 'Thirty days in a row. It’s part of you now.';
    if (n >= 14) return 'Two weeks straight: consistency is your superpower.';
    if (n >= 7) return 'A whole week without missing a day.';
    if (n >= 3) return n + ' days in a row: it’s becoming a habit.';
    if (n === 2) return 'Two stamps in a row. Tomorrow makes three.';

  }

  function render(just) {

    var canSwap = !done && !S.swapped[k];
    el.btnSwap.disabled = !canSwap;
    el.swapHint.textContent = done ? t('hintDone') : (S.swapped[k] ? t('hintSwapped') : t('hint'));

    // storico / history
    var keys = Object.keys(S.done).sort().reverse().slice(0, 8), h = '';
    keys.forEach(function (dk) { var it = byId[S.done[dk].id]; if (!it) return; var p = dk.split('-'); var dd = new Date(+p[0], +p[1] - 1, +p[2]); h += '<li><span class="d">' + esc(fmtShort(dd)) + '</span><span>' + esc(chText(it)) + '</span></li>'; });
    el.hist.innerHTML = h;
    el.histEmpty.hidden = keys.length > 0;
    el.histCount.textContent = total > 0 ? (total === 1 ? t('stamp1') : total + t('stampN')) : '';
  }

  // ---------- azioni / actions ----------
  el.btnDone.addEventListener('click', function () {
    var today = new Date(), k = key(today), ch = currentFor(today);
    S.done[k] = { id: ch.id, ts: Date.now() }; save();
    if (navigator.vibrate) { try { navigator.vibrate([18, 40, 28]); } catch (e) {} }
    render(true);
  });
  el.btnUndo.addEventListener('click', function () {
    var k = key(new Date()); delete S.done[k]; save(); render(false);
  });
  el.btnSwap.addEventListener('click', function () {
    var k = key(new Date()); if (S.done[k] || S.swapped[k]) return;
    S.swapped[k] = true; save(); render(false);
  });
  el.btnShare.addEventListener('click', function () {
    var today = new Date(), ch = currentFor(today), done = !!S.done[key(today)], st = streak();
    var text = done
      ? t('shareDone1') + chText(ch) + t('shareDone2') + st + (st === 1 ? t('day1') : t('dayN'))
      : t('shareTodo1') + chText(ch) + t('shareTodo2');
    if (navigator.share) {
      navigator.share({ title: t('shareTitle'), text: text }).catch(function () {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(t('copied')); }, function () { toast(t('copyFail')); });
    } else { toast(t('noShare')); }
  });
  el.btnLang.addEventListener('click', function () {
    LANG = LANG === 'it' ? 'en' : 'it';
    try { localStorage.setItem(LANG_KEY, LANG); } catch (e) {}
    applyLang(); render(false);
  });

  // cambio giorno mentre la pagina resta aperta / day change while the page stays open
  setInterval(function () { if (key(new Date()) !== shownKey) render(false); }, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && key(new Date()) !== shownKey) render(false); });

  // ---------- installazione (Android/Chrome) / install prompt ----------
  var deferredPrompt = null;
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferredPrompt = e;
    if (!standalone) el.btnInstall.hidden = false;
  });
  el.btnInstall.addEventListener('click', function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function () { deferredPrompt = null; el.btnInstall.hidden = true; });
  });
  window.addEventListener('appinstalled', function () { el.btnInstall.hidden = true; toast(t('installed')); });

  load();
  applyLang();
  render(false);

  // ---------- funziona anche offline / works offline ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
